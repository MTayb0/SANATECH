<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanaTech Blog | Electrical & Automation Experts Dubai</title>
    <meta name="description" content="Expert electrical, automation, handyman tips and guides for Dubai residents. DEWA approved advice and DIY tutorials.">
    <meta name="keywords" content="electrical dubai, home automation, handyman services, tile installation, DEWA approval">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="SanaTech Blog - Dubai Electrical & Automation Experts">
    <meta property="og:description" content="Professional insights for your home and business">
    <meta property="og:image" content="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=1200">
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Blog Specific Styles */
        :root {
            --primary: #0a192f;
            --secondary: #020c1b;
            --neon-blue: #00ffff;
            --neon-purple: #9d00ff;
            --text-light: #ccd6f6;
            --text-gray: #8892b0;
            --danger: #ff4444;
            --success: #00C851;
            --warning: #ffbb33;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--primary);
            color: var(--text-light);
            line-height: 1.6;
        }

        .blog-hero {
            height: 40vh;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            margin-top: 80px;
        }
        
        .blog-hero h1 {
            font-size: 4rem;
            color: white;
            text-shadow: 0 0 20px rgba(0,255,255,0.5);
        }
        
        .blog-hero p {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
        }
        
        .blog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Admin Panel */
        .admin-panel {
            background: linear-gradient(135deg, #1a2a3a, #0a1a2a);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: none;
        }
        
        .admin-panel.visible {
            display: block;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .admin-title {
            color: var(--neon-blue);
            font-size: 1.5rem;
        }
        
        /* Login Section */
        .login-section {
            background: rgba(10, 25, 47, 0.9);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .login-tabs {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .login-tab {
            padding: 0.5rem 2rem;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-tab.active {
            background: var(--neon-blue);
            color: var(--primary);
        }
        
        .login-form {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .login-form input,
        .login-form select {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            color: white;
        }
        
        .security-question {
            background: rgba(0,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            color: var(--neon-blue);
        }
        
        /* Write Blog Section */
        .write-blog-section {
            background: rgba(10, 25, 47, 0.9);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 3rem;
            display: none;
        }
        
        .write-blog-section.visible {
            display: block;
        }
        
        .write-blog-section h2 {
            color: var(--neon-blue);
            margin-bottom: 1.5rem;
        }
        
        .blog-input,
        .blog-textarea,
        .blog-select {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--neon-blue);
            border-radius: 10px;
            color: white;
            font-family: inherit;
        }
        
        .blog-textarea {
            min-height: 200px;
            resize: vertical;
        }
        
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        
        .tool-btn {
            padding: 0.5rem 1rem;
            background: rgba(0,255,255,0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tool-btn:hover {
            background: var(--neon-blue);
            color: var(--primary);
        }
        
        .media-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        
        .preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
        }
        
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .remove-item {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }
        
        /* Blog Posts */
        .blog-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        
        .blog-post {
            background: rgba(10, 25, 47, 0.7);
            border: 1px solid rgba(0,255,255,0.2);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .post-meta {
            display: flex;
            gap: 1rem;
            color: var(--neon-blue);
            font-size: 0.9rem;
        }
        
        .post-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s;
        }
        
        .action-btn:hover {
            color: var(--neon-blue);
        }
        
        .action-btn.delete:hover {
            color: var(--danger);
        }
        
        .post-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, white, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .post-content {
            color: var(--text-gray);
            line-height: 1.8;
        }
        
        .post-content img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            margin: 1rem 0;
            border: 2px solid rgba(0,255,255,0.3);
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .post-content img:hover {
            transform: scale(1.02);
        }
        
        .post-content iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 10px;
            margin: 1rem 0;
        }
        
        .read-more {
            display: inline-block;
            color: var(--neon-blue);
            cursor: pointer;
            margin: 1rem 0;
            font-weight: 600;
        }
        
        .full-content {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0,255,255,0.2);
        }
        
        .full-content.visible {
            display: block;
        }
        
        /* Comments */
        .comments-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(0,255,255,0.2);
        }
        
        .comment {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: var(--neon-blue);
        }
        
        .comment-actions {
            display: flex;
            gap: 10px;
        }
        
        .comment-content {
            color: var(--text-gray);
        }
        
        .comment-form {
            margin-top: 2rem;
        }
        
        .comment-input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,255,255,0.2);
            border-radius: 5px;
            color: white;
        }
        
        /* Sidebar */
        .blog-sidebar {
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        
        .sidebar-widget {
            background: rgba(10, 25, 47, 0.7);
            border: 1px solid rgba(0,255,255,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .widget-title {
            color: var(--neon-blue);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--neon-blue);
        }
        
        .search-box {
            display: flex;
            gap: 10px;
        }
        
        .search-box input {
            flex: 1;
            padding: 0.8rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--neon-blue);
            border-radius: 5px;
            color: white;
        }
        
        .category-list {
            list-style: none;
        }
        
        .category-list li {
            margin-bottom: 0.5rem;
        }
        
        .category-list a {
            color: var(--text-gray);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            transition: color 0.3s;
        }
        
        .category-list a:hover {
            color: var(--neon-blue);
        }
        
        .recent-post {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0,255,255,0.1);
        }
        
        .recent-post img {
            width: 60px;
            height: 60px;
            border-radius: 5px;
            object-fit: cover;
        }
        
        .recent-post-info h4 {
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        
        .recent-post-info a {
            color: white;
            text-decoration: none;
        }
        
        .recent-post-info .date {
            font-size: 0.8rem;
            color: var(--text-gray);
        }
        
        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        
        .lightbox.visible {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--neon-blue);
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background: var(--neon-blue);
            color: var(--primary);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        /* Loading */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        @media (max-width: 768px) {
            .blog-hero h1 {
                font-size: 2.5rem;
            }
            .blog-layout {
                grid-template-columns: 1fr;
            }
            .blog-sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="circuit-loader">
                <div class="wire"></div>
                <div class="node node1"></div>
                <div class="node node2"></div>
                <div class="node node3"></div>
            </div>
            <h2 class="loading-text">LOADING BLOG</h2>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>Sana<span>Tech</span></h1>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                <a href="index.html#services" class="nav-link"><i class="fas fa-cogs"></i> Services</a>
                <a href="gallery.html" class="nav-link"><i class="fas fa-images"></i> Gallery</a>
                <a href="blog.html" class="nav-link active"><i class="fas fa-blog"></i> Blog</a>
                <a href="index.html#contact" class="nav-link"><i class="fas fa-phone"></i> Contact</a>
                <a href="tel:+971509304586" class="nav-cta">
                    <i class="fas fa-phone-alt"></i> +971 50 930 4586
                </a>
            </div>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Blog Hero -->
    <section class="blog-hero">
        <div class="hero-content">
            <h1 class="animate__animated animate__fadeInUp">SanaTech <span>BLOG</span></h1>
            <p class="animate__animated animate__fadeInUp">Expert insights, DIY guides & industry news from Dubai</p>
        </div>
    </section>

    <!-- Blog Content -->
    <div class="blog-container">
        <!-- Login Section -->
        <div class="login-section" id="loginSection">
            <div class="login-tabs">
                <button class="login-tab active" onclick="switchLoginTab('login')">Login</button>
                <button class="login-tab" onclick="switchLoginTab('register')">Register</button>
            </div>
            
            <div id="loginForm" class="login-form">
                <input type="text" id="loginName" placeholder="Your Name">
                <input type="email" id="loginEmail" placeholder="Your Email">
                <button class="btn-primary" onclick="loginUser()">Login / Continue</button>
            </div>
            
            <div id="registerForm" class="login-form" style="display: none;">
                <input type="text" id="regName" placeholder="Your Name">
                <input type="email" id="regEmail" placeholder="Your Email">
                <div class="security-question">
                    <p>Security Question (for admin only):</p>
                    <p>Your village name + any number (e.g., "mumbai123")</p>
                </div>
                <input type="text" id="regSecurity" placeholder="Security Answer">
                <button class="btn-primary" onclick="registerUser()">Register</button>
            </div>
            
            <div id="adminRecovery" style="display: none; margin-top: 1rem;">
                <hr style="border-color: var(--neon-blue); margin: 1rem 0;">
                <p>Admin Password Recovery:</p>
                <input type="text" id="recoveryAnswer" placeholder="Your village + number">
                <button class="btn-secondary" onclick="recoverAdmin()">Recover Admin Access</button>
            </div>
        </div>

        <!-- Write Blog Section (shown when logged in) -->
        <div class="write-blog-section" id="writeSection">
            <h2><i class="fas fa-pen-fancy"></i> Write a New Blog Post</h2>
            
            <input type="text" id="postTitle" class="blog-input" placeholder="Post Title *">
